components:
  schemas:
    Master:
      type: object
      properties:
        MasterId:
          type: integer
          example: 1
        Name:
          type: string
          example: "Иван Иванов"
        Description:
          type: string
          example: "Профессиональный мастер"
        Photo:
          type: string
          format: byte
          example: "base64 encoded image"

    Type:
      type: object
      properties:
        TypeId:
          type: integer
          example: 1
        TypeName:
          type: string
          example: "Массаж"
        Description:
          type: string
          example: "Расслабляющий массаж"

    User:
      type: object
      properties:
        ID:
          type: integer
          example: 1
        Login:
          type: string
          example: "user123"
        Email:
          type: string
          example: "user@example.com"
        Role:
          type: integer
          example: 0

    Schedule:
      type: object
      properties:
        EnrollmentId:
          type: integer
          example: 1
        ServiceId:
          type: integer
          example: 1
        UserId:
          type: integer
          example: 1
        Date:
          type: string
          format: date-time
          example: "2023-10-15T14:30:00Z"
        Time:
          type: string
          example: "14:30"
        Duration:
          type: integer
          example: 60
        Status:
          type: string
          example: "Pending"
    Service:
      type: object
      properties:
        ServiceId:
          type: integer
          example: 1
        Name:
          type: string
          example: "Урок живописи"
        Description:
          type: string
          example: "Профессиональный урок"
        TypeId:
          type: integer
          example: 1
        Location:
          type: string
          example: "Москва"
        MasterId:
          type: integer
          example: 1
          
    Enrollment:
      type: object
      properties:
        EnrollmentId:
          type: integer
          example: 1
        ServiceId:
          type: integer
          example: 1
        UserId:
          type: integer
          example: 1
        Date:
          type: string
          format: date-time
          example: "2023-10-15T14:30:00Z"
        Time:
          type: string
          example: "14:30"
        Duration:
          type: integer
          example: 60
        Status:
          type: string
          example: "Pending"
        Comments:
          type: string
          example: "Дополнительные пожелания"